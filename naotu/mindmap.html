# GopherAI 全栈 AI 助手

## 技术栈
- Go 1.24 + Gin + GORM (MySQL)
- AI 框架：cloudwego/eino
- LLM：OpenAI / Ollama / 阿里百炼 qwen
- 前端：Vue3 + Element Plus
- 消息队列：RabbitMQ（异步落库）
- 缓存/向量库：Redis + RediSearch
- MCP：mark3labs/mcp-go
- TTS：百度语音合成
- 图像识别：ONNX MobileNetV2

## 项目结构
- 依赖方向（严格单向）
  - router → controller → service → dao → model
  - common/ 共享基础设施
  - config 最底层全局引用
- main.go 启动入口
- router 路由注册
- controller HTTP 接口层
- service 业务逻辑层
- dao 数据访问层（GORM）
- model 数据模型
- middleware/jwt JWT 鉴权
- common 共享基础设施
  - aihelper AI 助手核心
  - rag RAG 检索增强
  - mcp MCP 子项目
  - tts 百度语音合成
  - image ONNX 识别
  - email QQ 邮箱验证码
  - redis Redis + RediSearch
  - rabbitmq 消息队列封装
  - mysql GORM 初始化
  - code 统一错误码
- utils 工具函数
- vue-frontend 前端

## 启动流程
- main.go
  1. 加载 TOML 配置（GetConfig 单例）
  2. 初始化 MySQL + AutoMigrate
  3. 从 DB 加载历史消息重建 AIHelperManager
  4. 初始化 Redis
  5. 初始化 RabbitMQ（消息队列消费者）
  6. 启动 HTTP 服务 host:9090

## 核心机制
- AIHelperManager + AIHelper
  - 一个会话绑定一个 AIHelper（内存历史）
  - manager 单例：map[user]map[session]helper
  - saveFunc 回调异步保存
- 模型工厂（可插拔）
  - modelType 字符串 → 创建器
  - type=1 OpenAI
  - type=2 阿里百炼 RAG
  - type=3 MCP
  - type=4 Ollama
  - RegisterModel 运行时注册
- RAG 问答
  - 上传 .md/.txt → 存储 uploads/user/
  - 创建 Redis 向量索引
  - 提问检索 TopK=5 → BuildRAGPrompt
  - 替换最后一条消息 → qwen 回答
  - 每用户单文档约束
- MCP 两阶段调用
  - 第一次 LLM 调用返回固定 JSON
  - isToolCall? 决定直答或调工具
  - 调 get_weather → 第二次 LLM 总结
- 消息异步落库
  - AIHelper → RabbitMQ Message 队列
  - 消费者协程写 MySQL
  - 不阻塞 AI 回复

## 数据流
- 流式聊天（SSE）
  - POST /AI/chat/send-stream
  - 服务端 data: 事件流 + Flush
  - 结束 data: [DONE]
  - 消息异步发布 RabbitMQ
- 新建流式会话
  - 先下发 sessionId（侧边栏新标签）
  - 再流式输出回答
- RAG 文件上传
  - multipart → 校验 → 删旧文件旧索引
  - 保存 → 建索引 → Embedding + Store

## API 接口（前缀 /api/v1）
- 用户接口（无需鉴权）
  - POST /user/register 邮箱注册
  - POST /user/login 账号密码登录 → JWT
  - POST /user/captcha 发送验证码
- AI 接口（需 JWT）
  - GET /AI/chat/sessions 会话列表
  - POST /AI/chat/send-new-session 新建+同步发送
  - POST /AI/chat/send 指定会话发送
  - POST /AI/chat/history 会话历史
  - POST /AI/chat/send-stream-new-session 新建+SSE
  - POST /AI/chat/send-stream 指定会话 SSE
  - POST /AI/chat/tts 创建 TTS 任务
  - GET /AI/chat/tts/query 查询 TTS
- 图像/文件（需 JWT）
  - POST /image/recognize 图片识别
  - POST /file/upload RAG 文档上传
- 鉴权方式
  - Authorization: Bearer token
  - 或 ?token= 参数

## 配置说明
- config/config.toml
  - mainConfig 端口/主机
  - emailConfig QQ 邮箱 SMTP
  - redisConfig
  - mysqlConfig
  - jwtConfig 过期时间/密钥
  - rabbitmqConfig
  - ragModelConfig 向量模型/dimension
  - voiceServiceConfig 百度密钥
- 环境变量
  - OPENAI_API_KEY
  - OPENAI_MODEL_NAME
  - OPENAI_BASE_URL

## 快速启动
1. 准备 MySQL / Redis(RediSearch) / RabbitMQ
2. 修改 config.toml
3. 设置 OpenAI 兼容环境变量
4. go mod tidy && go run main.go
5. （可选）启动 MCP Server
6. （可选）启动 Vue 前端

## 扩展指南
- 新增模型：实现 AIModel → RegisterModel
- 新增 MCP 工具：mcpServer.AddTool
- 新增 API：controller → router
- 新增数据表：model → mysql.go AutoMigrate

## 关键设计决策
- 会话绑定 AIHelper：避免每次查库
- Manager 全局单例：sync.Once 线程安全
- 模型工厂：可插拔、前端切换
- RabbitMQ 异步落库：不阻塞回复
- 每用户单 RAG 文档：简化隔离
- Redis 向量索引：复用现有 Redis
- MCP 两阶段：不依赖原生 Tool Calling
